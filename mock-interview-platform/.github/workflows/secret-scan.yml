name: Secret Scan
on: [push, pull_request]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog-action@v2
        with:
          directory: '.'
          use_regex: true
          # By default this action exits with non-zero when secrets are found. Adjust as needed.
