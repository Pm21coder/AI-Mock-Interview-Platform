version: '3.8'

# Supplementary docker-compose to run Redis + an RQ worker alongside the
# existing docker-compose.yml. Use alongside the main compose file:
#   docker compose -f docker-compose.yml -f docker-compose.rq.yml up --build

services:
  redis:
    image: redis:7-alpine
    container_name: mock_interview_redis
    ports:
      - '6379:6379'
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  worker:
    build: ./backend
    container_name: mock_interview_worker
    command: ["python", "-m", "rq", "worker", "default"]
    depends_on:
      - redis
    environment:
      - FLASK_APP=app
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URI=${MONGODB_URI}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - ENABLE_GEMINI=${ENABLE_GEMINI}
    volumes:
      - ./backend:/app
    restart: unless-stopped

# This file intentionally does not re-declare the backend/frontend/mongodb
# services which are defined in docker-compose.yml; use both files together to
# start the full stack with worker support.